[tool.basedpyright]
# The app's base image (ghcr.io/hassio-addons/base 21.x = Alpine 3.22) is
# Python 3.12. Dev-only tool; nothing here ships. Scope grows with the typing
# migration: server.py joins when the dead old code is deleted.
typeCheckingMode = "recommended"
reportMatchNotExhaustive = "error"
pythonVersion = "3.12"
include = [
  "ha_deploy/rootfs/app/deploy.py",
  "ha_deploy/rootfs/app/git_state.py",
  "ha_deploy/rootfs/app/ha_core.py",
  "ha_deploy/rootfs/app/server.py",
  "ha_deploy/rootfs/app/supervisor.py",
  "tests",
]
venvPath = "."
venv = ".venv"
# tests reach the app modules via the conftest sys.path hook.
extraPaths = ["ha_deploy/rootfs/app"]

# --- ruff -------------------------------------------------------------------
# Home Assistant Core's ruff config (Apache-2.0, pyproject.toml in
# home-assistant/core), trimmed: the shared select/ignore lists plus
# isort/pydocstyle/mccabe settings are kept; Core-specific import-alias
# tables, banned homeassistant.* APIs, and per-path ignores are dropped.

[tool.ruff]
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
# UP035 (assert_never should come from typing) is added to the ignore list
# below: typing.assert_never needs Python 3.11+ and the dev venv runs 3.10;
# typing_extensions is the backport. The app image itself is 3.12.
select = [
  "A001",   # Variable {name} is shadowing a Python builtin
  "ASYNC",  # flake8-async
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C",      # complexity
  "COM818", # Trailing comma on bare tuple prohibited
  "D",      # docstrings
  "DTZ003", # Use datetime.now(tz=) instead of datetime.utcnow()
  "DTZ004", # Use datetime.fromtimestamp(ts, tz=) instead of datetime.utcfromtimestamp(ts)
  "DTZ011", # Use datetime.now(tz=).date() instead of date.today()
  "E",      # pycodestyle
  "F",      # pyflakes/autoflake
  "F541",   # f-string without any placeholders
  "FLY",    # flynt
  "FURB",   # refurb
  "G",      # flake8-logging-format
  "I",      # isort
  "INP",    # flake8-no-pep420
  "ISC",    # flake8-implicit-str-concat
  "ICN001", # import conventions; {name} should be imported as {asname}
  "ICN002", # import conventions; {name} should not be imported as {asname}
  "LOG",    # flake8-logging
  "N804",   # First argument of a class method should be named cls
  "N805",   # First argument of a method should be named self
  "N806",   # Variable {name} in function should be snake_case
  "N815",   # Variable {name} in class scope should not be mixedCase
  "PERF",   # Perflint
  "PGH",    # pygrep-hooks
  "PIE",    # flake8-pie
  "PL",     # pylint
  "PT",     # flake8-pytest-style
  "PTH",    # flake8-pathlib
  "PYI",    # flake8-pyi
  "RET",    # flake8-return
  "RSE",    # flake8-raise
  "RUF",    # Ruff-specific rules
  "S107",   # Possible hardcoded password assigned to function default
  "S102",   # Use of exec detected
  "S103",   # bad-file-permissions
  "S108",   # hardcoded-temp-file
  "S301",   # suspicious-pickle-usage
  "S306",   # suspicious-mktemp-usage
  "S307",   # suspicious-eval-usage
  "S313",   # suspicious-xmlc-element-tree-usage
  "S314",   # suspicious-xml-element-tree-usage
  "S315",   # suspicious-xml-expat-reader-usage
  "S316",   # suspicious-xml-expat-builder-usage
  "S317",   # suspicious-xml-sax-usage
  "S318",   # suspicious-xml-mini-dom-usage
  "S319",   # suspicious-xml-pull-dom-usage
  "S601",   # paramiko-call
  "S602",   # subprocess-popen-with-shell-equals-true
  "S604",   # call-with-shell-equals-true
  "S608",   # hardcoded-sql-expression
  "S609",   # unix-command-wildcard-injection
  "SIM",    # flake8-simplify
  "SLF",    # flake8-self
  "SLOT",   # flake8-slots
  "T20",    # flake8-print
  "TC",     # flake8-type-checking
  "TID",    # Tidy imports
  "TRY",    # tryceratops
  "UP",     # pyupgrade
  "UP031",  # Use format specifiers instead of percent format
  "UP032",  # Use f-string instead of `format` call
  "W",      # pycodestyle
]

ignore = [
  "ASYNC109", # Async function definition with a `timeout` parameter
  "B008",     # Do not perform function call in argument defaults
  "B019",     # lru_cache on methods can lead to memory leaks
  "D202",     # No blank lines allowed after function docstring
  "D203",     # 1 blank line required before class docstring
  "D213",     # Multi-line docstring summary should start at the second line
  "D406",     # Section name should end with a newline
  "D407",     # Section name underlining
  "D417",     # Missing argument descriptions in docstring
  "E501",     # line too long
  "UP035",    # assert_never stays on typing_extensions (dev venv is 3.10)

  "PLC1901", # {existing} can be simplified; too many false positives
  "PLR0911", # Too many return statements (deploy() is a straight-line flow)
  "PLR0912", # Too many branches
  "PLR0913", # Too many arguments to function call
  "PLR0915", # Too many statements
  "PLR0917", # Too many positional arguments
  "PLR2004", # Magic value used in comparison
  "PLW0108", # Unnecessary lambda wrapping a function call
  "PLW1641", # __eq__ without __hash__
  "PLW2901", # Outer variable overwritten by inner target
  "PT011",   # pytest.raises({exception}) is too broad
  "PT018",   # Assertion should be broken down into multiple parts
  "RUF001",  # String contains ambiguous unicode character
  "RUF012",  # Mutable class attributes should be annotated with ClassVar
  "RUF015",  # Prefer next(...) over single element slice
  "RUF043",  # Pattern passed to match= contains metacharacters
  "SIM102",  # Use a single if statement instead of nested if statements
  "SIM103",  # Return the condition directly
  "SIM108",  # Use ternary operator instead of if-else-block
  "SIM115",  # Use context handler for opening files

  "TC001", # Move application import into a type-checking block
  "TC002", # Move third-party import into a type-checking block
  "TC003", # Move standard library import into a type-checking block
  "TC006", # Add quotes to type expression in typing.cast()

  "TRY003", # Avoid specifying long messages outside the exception class
  "TRY400", # Use logging.exception instead of logging.error
  "TRY300", # Step functions return from inside try by design
  "TRY301", # Raises inside try are fine for our small handlers
  "BLE001", # except Exception is the decided defensive pattern; every
            # handler maps the error into a structured result
  "PLW1510", # subprocess rc is mapped by hand by design
  "PTH",     # os.path is fine here (Core also defers these, temporary)

  # May conflict with the formatter
  "W191", "E111", "E114", "E117", "D206", "D300", "Q", "COM812", "COM819",

  "FURB116", # Use int literals instead of hex/octal/etc.
  "ISC004",  # Disabled pending ruff upstream decision (as in Core)
  "LOG004",  # Disabled pending ruff upstream decision (as in Core)
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
# The app files are standalone scripts, not a package.
"ha_deploy/rootfs/app/**" = ["INP001"]
# Tests are documentation-free by choice; not a package.
"tests/**" = ["INP001", "D"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pydocstyle]
convention = "google"
